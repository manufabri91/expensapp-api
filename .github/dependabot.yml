version: 2
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Major upgrades require a planned compatibility review.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # Maven tags also encode Java/Alpine variants; maintain these images manually.
    # The weekly image vulnerability scan remains enabled in security.yml.
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
