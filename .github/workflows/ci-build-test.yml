name: Build and Run tests

on:
  pull_request:
    branches: [main, develop]

jobs:
  pr-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: expenses_security
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: security-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d expenses_security"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17.0.21+9"
          distribution: "temurin"
          cache: maven

      - name: Build and test with Maven
        run: >-
          mvn -B verify --file pom.xml
          -Dexpenses.postgres.url=jdbc:postgresql://localhost:5432/expenses_security
          -Dexpenses.postgres.username=postgres
          -Dexpenses.postgres.password=security-test-only

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      # Codecov's patch/project checks (see codecov.yml) gate PRs against this report, ratcheting
      # coverage up over time instead of a hand-maintained jacoco:check <includes> list.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./target/site/jacoco/jacoco.xml
          fail_ci_if_error: true
